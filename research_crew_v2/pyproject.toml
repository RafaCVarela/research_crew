[project]
name = "research_crew_v2"
version = "0.1.0"
description = "research-crew-v2 using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "litellm>=1.83.0",
]

[project.scripts]
research_crew_v2 = "research_crew_v2.main:run"
run_crew = "research_crew_v2.main:run"
train = "research_crew_v2.main:train"
replay = "research_crew_v2.main:replay"
test = "research_crew_v2.main:test"
run_with_trigger = "research_crew_v2.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
